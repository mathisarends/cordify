[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessed"
version = "0.1.0"
description = "A native Python, everything-is-a-plugin agent harness inspired by Cordis and DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.63,<3"]
anthropic = ["pydantic-ai-slim[anthropic]>=2.63,<3"]
google = ["pydantic-ai-slim[google]>=2.63,<3"]

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.3,<1",
    "ty>=0.0.93,<0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harnessed*"]

[tool.setuptools.package-data]
harnessed = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID252", "PLC0415"]
# Shell's public timeout parameter is implemented with asyncio.timeout internally.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Provider SDKs are optional; importing the core must not require an extra.
"harnessed/models/pydantic_ai.py" = ["PLC0415"]
# Tests import optional integrations and patch import failures in their own scope.
"tests/**/*.py" = ["PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = ["harnessed", "examples", "scripts", "tests/typing"]

[tool.ty.rules]
unused-ignore-comment = "error"
