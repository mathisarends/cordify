[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cordify"
version = "0.1.0"
description = "A native Python, everything-is-a-plugin agent harness inspired by Cordis and DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
deepseek = ["httpx>=0.27,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27,<1", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cordify*"]

[tool.setuptools.package-data]
cordify = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Shell's public timeout parameter is implemented with asyncio.timeout internally.
ignore = ["ASYNC109"]
