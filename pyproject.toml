[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cordify"
version = "0.1.0"
description = "A native Python, everything-is-a-plugin agent harness inspired by Cordis and DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
deepseek = ["httpx>=0.27,<1"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.3,<1",
    "ty>=0.0.93,<0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cordify*"]

[tool.setuptools.package-data]
cordify = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Shell's public timeout parameter is implemented with asyncio.timeout internally.
ignore = ["ASYNC109"]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = ["cordify", "examples", "scripts"]
