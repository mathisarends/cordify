name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pip wheel --no-deps . -w dist
      - name: Install built wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('dist').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)"
      - name: Import installed package without the checkout
        run: python -I -c "from cordify.kernel import Context, Key; from cordify.presets import minimal; from cordify.adapters.deepseek import DeepSeekLLM"
