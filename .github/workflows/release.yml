name: Release

on:
  release:
    types: [published]
  # Manual runs validate main and build artifacts without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  validate:
    name: Validate release source and version
    if: github.repository == 'mathisarends/harnessed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main and a matching version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = f"v{project['version']}"
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              if os.environ["RELEASE_TAG"] != expected:
                  raise SystemExit(f"Release tag must be {expected}.")
              if os.environ["GITHUB_REF"] != f"refs/tags/{expected}":
                  raise SystemExit("Release ref does not match the package version.")
          elif os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Run release validation from main.")
          print(f"Validated {project['name']} {project['version']}.")
          PY

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and verify distributions
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Build wheel and source archive
        run: uv build --no-sources
      - name: Check the installed wheel outside the checkout
        run: uv run --locked --no-sync python scripts/check_wheel.py
      - name: Validate package metadata and description
        run: uv run --locked --no-sync twine check --strict dist/*
      - name: Record distribution hashes
        working-directory: dist
        run: sha256sum * > ../SHA256SUMS
      - name: Save verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save distribution hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-hashes
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/harnessed
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          print-hash: true

  release-assets:
    name: Attach published distributions to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Download distribution hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-hashes
      - name: Verify hashes and attach the same artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd dist && sha256sum --check ../SHA256SUMS)
          gh release upload "$RELEASE_TAG" dist/* SHA256SUMS --clobber
